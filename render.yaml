# Account API only. AI compute is NOT provisioned by this Blueprint.
services:
  - type: web
    name: saegim-api
    runtime: node
    branch: fix/windows-local-setup
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev --workspace @sori/api --include-workspace-root=false && npm run build:api
    startCommand: node scripts/hosted-api-preflight.cjs && npm --workspace @sori/api run start:prod
    healthCheckPath: /v1/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGINS
        sync: false
      - key: PAID_FEATURES_ENABLED
        value: "false"
      - key: TUTOR_PROVIDER
        value: disabled
      - key: PROVIDER_MONTHLY_SPEND_CAP_CENTS
        value: "0"
      - key: OPENROUTER_AUDIO_ENABLED
        value: "false"
