services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sori
      POSTGRES_USER: sori
      POSTGRES_PASSWORD: sori
    ports:
      - "5432:5432"
    volumes:
      - sori-postgres:/var/lib/postgresql/data
      - ./apps/api/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sori -d sori"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sori-postgres:
